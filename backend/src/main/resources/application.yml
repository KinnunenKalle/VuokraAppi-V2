spring:
  application:
    name: vuokraappi-backend
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: 8080

signicat:
  client-id: ${SIGNICAT_CLIENT_ID:}
  client-secret: ${SIGNICAT_CLIENT_SECRET:}
  base-url: ${SIGNICAT_BASE_URL:https://id.test.signicat.com/oidc}
  redirect-uri: ${SIGNICAT_REDIRECT_URI:http://localhost:8080/v1/identity/verify/callback}
  frontend-redirect-url: ${SIGNICAT_FRONTEND_REDIRECT_URL:http://localhost:3000/identity-verified}
  lookup-secret: ${IDENTITY-LOOKUP-SECRET:}
  encryption-key: ${IDENTITY-ENCRYPTION-KEY:}
  userinfo-private-key: ${SIGNICAT_USERINFO_PRIVATE_KEY:}
